## for local development of AdaptEDU
##
## Defines a single service `adaptedu` built from the repository Dockerfile.
##  UI is at http://localhost:8080
services:
  adaptedu:
    build:
      context: .
      dockerfile: Dockerfile
    image: adaptedu:local
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
